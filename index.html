<audio id="openingMusic" preload="auto" playsinline>
  <source src="Vural_Burcu_Opening.mp3" type="audio/mpeg">
</audio>
<script>
(() => {
  const openToggle = document.getElementById('open');
  const music = document.getElementById('openingMusic');
  const soundBtn = document.getElementById('soundBtn');
  const tap = document.querySelector('.tap');
  const replay = document.querySelector('.replay');

  tap.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      tap.click();
    }
  });

  music.volume = 0.72;

  function playOpeningMusic() {
    try {
      music.currentTime = 0;
      const p = music.play();
      if (p && p.catch) p.catch(() => {});
      soundBtn.textContent = '♫ Müzik';
    } catch(e) {}
  }

  tap.addEventListener('click', () => {
    // iPhone permits sound because this runs inside the user's tap.
    playOpeningMusic();
  }, {passive:true});

  replay.addEventListener('click', () => {
    setTimeout(() => {
      if (!openToggle.checked) {
        music.pause();
        music.currentTime = 0;
        soundBtn.textContent = '♫ Müzik';
      }
    }, 80);
  }, {passive:true});

  soundBtn.addEventListener('click', () => {
    if (music.paused) {
      const p = music.play();
      if (p && p.catch) p.catch(() => {});
      soundBtn.textContent = '♫ Müzik';
    } else {
      music.pause();
      soundBtn.textContent = '♩ Sessiz';
    }
  });
})();
</script>
